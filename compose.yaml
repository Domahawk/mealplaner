services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ${DB_DATABASE:-mealplaner}
      POSTGRES_USER: ${DB_USERNAME:-mealplaner}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    stop_grace_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    volumes:
      - .:/var/www/html:z
      - vendor:/var/www/html/vendor
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'php', '/usr/local/bin/fpm-health.php']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  frontend:
    init: true
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    volumes:
      - .:/var/www/html:z
      - node_modules:/var/www/html/node_modules
      - npm_cache:/home/node/.npm
    ports:
      - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      VITE_HMR_HOST: ${VITE_HMR_HOST:-localhost}
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
      VITE_POLL_INTERVAL: ${VITE_POLL_INTERVAL:-300}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/usr/local/bin/vite-health.mjs']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  nginx:
    image: nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:80'
    volumes:
      - .:/var/www/html:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/up']
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  vendor:
  composer_cache:
  node_modules:
  npm_cache:
